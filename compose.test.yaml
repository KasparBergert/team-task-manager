name: team-task-manager-test

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: team_task_manager_test
      MARIADB_USER: laravel_test
      MARIADB_PASSWORD: laravel_test
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  tests:
    build: .
    command: ["php", "artisan", "test", "--fail-on-skipped"]
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      APP_ENV: testing
      APP_KEY: test-only-key-for-laravel-tests!
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: team_task_manager_test
      DB_USERNAME: laravel_test
      DB_PASSWORD: laravel_test

  apache:
    profiles: [web]
    image: httpd:2.4
    command: ["httpd-foreground", "-c", "Include conf/extra/laravel.conf"]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
    configs:
      - source: apache_config
        target: /usr/local/apache2/conf/extra/laravel.conf

configs:
  apache_config:
    file: ./apache.conf
